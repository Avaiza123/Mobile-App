name: Mobile-App CI/CD Pipeline

on:
  push:
    branches: [ "main", "deploy" ]

jobs:
  auto_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  auto_qa:
    needs: auto_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  auto_deploy:
    needs: auto_qa
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Nginx Docker Container
        run: |
          docker build -t mobile-app-demo .
          docker stop mobile-demo || true
          docker rm mobile-demo || true
          docker run -d --name mobile-demo -p 8081:80 mobile-app-demo