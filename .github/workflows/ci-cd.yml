name: Mobile-App CI/CD Pipeline

on:
  push:
    branches: [ "main", "deploy" ]

jobs:
  auto_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

  auto_qa:
    needs: auto_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  auto_deploy:
    needs: auto_qa
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Nginx Docker Container
        run: |
          docker build -t mobile-app-demo .
          docker stop mobile-demo 2>$null
          docker rm mobile-demo 2>$null
          docker run -d --name mobile-demo -p 8081:80 mobile-app-demo
