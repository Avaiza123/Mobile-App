name: Mobile-App CI/CD Pipeline

on:
  push:
    branches: [ "main", "deploy" ]

jobs:
  auto_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: ./gradlew test --continue --no-daemon

  auto_qa:
    needs: auto_test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  auto_deploy:
    needs: auto_qa
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Nginx Docker Container
        run: |
          docker build -t mobile-app-demo .
          docker stop mobile-demo 2>$null
          docker rm mobile-demo 2>$null
          docker run -d --name mobile-demo -p 8081:80 mobile-app-demo
