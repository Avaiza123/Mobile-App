name: Mobile-App CI/CD Pipeline

on:
  push:
    branches:
      - main
      - deploy

  pull_request:
    branches:
      - main
      - deploy

# Prevent multiple deployments/builds for the same branch
concurrency:
  group: mobile-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # 1. AUTOMATED TESTING
  # ============================================================
  auto_test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Java 17
      # ----------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # ----------------------------------------------------------
      # Flutter
      # ----------------------------------------------------------
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ----------------------------------------------------------
      # Verify environment
      # ----------------------------------------------------------
      - name: Check Flutter version
        run: flutter --version

      - name: Check Dart version
        run: dart --version

      - name: Check Java version
        run: java -version

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------
      - name: Install Dependencies
        run: flutter pub get

      # ----------------------------------------------------------
      # Static code analysis
      # ----------------------------------------------------------
      - name: Run Flutter Analyze
        run: flutter analyze

      # ----------------------------------------------------------
      # Unit/widget tests
      # ----------------------------------------------------------
      - name: Run Flutter Tests
        run: flutter test


  # ============================================================
  # 2. QUALITY ASSURANCE + ANDROID BUILD
  # ============================================================
  auto_qa:
    name: Android QA & Debug APK
    needs: auto_test
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Java 17
      # Required for modern Android Gradle Plugin
      # ----------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # ----------------------------------------------------------
      # Flutter
      # ----------------------------------------------------------
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ----------------------------------------------------------
      # Verify environment
      # ----------------------------------------------------------
      - name: Check Flutter version
        run: flutter --version

      - name: Check Java version
        run: java -version

      # ----------------------------------------------------------
      # Clean project
      # ----------------------------------------------------------
      - name: Flutter Clean
        run: flutter clean

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Get Flutter Dependencies
        run: flutter pub get

      # ----------------------------------------------------------
      # Verify Flutter project
      # ----------------------------------------------------------
      - name: Flutter Doctor
        run: flutter doctor -v

      # ----------------------------------------------------------
      # Build Debug APK
      # ----------------------------------------------------------
      - name: Build Debug APK
        run: flutter build apk --debug

      # ----------------------------------------------------------
      # Verify generated APK
      # ----------------------------------------------------------
      - name: Verify APK
        run: |
          echo "Generated APK files:"
          ls -lh build/app/outputs/flutter-apk/

          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "Debug APK generated successfully."


      # ----------------------------------------------------------
      # Upload APK
      # ----------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # 3. DEPLOYMENT
  # ============================================================
  auto_deploy:
    name: Docker Deployment
    needs: auto_qa

    # Deployment should only happen after a push to deploy.
    # Pull requests should never deploy.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/deploy'

    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Verify Docker
      # ----------------------------------------------------------
      - name: Check Docker
        run: |
          docker --version
          docker info

      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build -t mobile-app-demo:latest .

      # ----------------------------------------------------------
      # Stop existing container
      # ----------------------------------------------------------
      - name: Stop Existing Container
        run: |
          docker stop mobile-demo 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No running mobile-demo container found."
          }

      # ----------------------------------------------------------
      # Remove existing container
      # ----------------------------------------------------------
      - name: Remove Existing Container
        run: |
          docker rm mobile-demo 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No existing mobile-demo container found."
          }

      # ----------------------------------------------------------
      # Run new container
      # ----------------------------------------------------------
      - name: Start New Docker Container
        run: |
          docker run -d `
            --name mobile-demo `
            --restart unless-stopped `
            -p 8081:80 `
            mobile-app-demo:latest

      # ----------------------------------------------------------
      # Verify deployment
      # ----------------------------------------------------------
      - name: Verify Container
        run: |
          Start-Sleep -Seconds 5
          docker ps --filter "name=mobile-demo"

      # ----------------------------------------------------------
      # Show container logs if needed
      # ----------------------------------------------------------
      - name: Show Container Logs
        if: always()
        run: |
          docker logs mobile-demo 2>$null
