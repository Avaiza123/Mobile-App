name: Mobile-App CI/CD Pipeline

on:
  push:
    branches: [ "main", "deploy" ]

jobs:
  auto_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test || true # Allows pipeline to proceed if no test dependency is configured


  auto_qa:
    needs: auto_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --------------------------------------------------
      # Set up Java 17 for Android/Gradle
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # --------------------------------------------------
      # Set up Flutter SDK
      # --------------------------------------------------
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # --------------------------------------------------
      # Show versions for debugging
      # --------------------------------------------------
      - name: Check Flutter Version
        run: flutter --version

      - name: Check Java Version
        run: java -version

      # --------------------------------------------------
      # Clean & Get Dependencies
      # --------------------------------------------------
      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      # --------------------------------------------------
      # Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      # --------------------------------------------------
      # Verify APK was created
      # --------------------------------------------------
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo "Debug APK successfully generated."

      # --------------------------------------------------
      # Upload APK Artifact
      # --------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk


  auto_deploy:
    needs: auto_qa
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Nginx Docker Container
        run: |
         & "C:\Users\avaiza.shahid\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" build -t mobile-app-demo .
         & "C:\Users\avaiza.shahid\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" stop mobile-demo 2>$null
         & "C:\Users\avaiza.shahid\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" rm mobile-demo 2>$null
         & "C:\Users\avaiza.shahid\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" run -d --name mobile-demo -p 8081:80 mobile-app-demo
