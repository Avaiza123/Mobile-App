org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Remove false flags and enable modern Kotlin compilation
android.builtInKotlin=true

# Force Kotlin compiler options globally across all plugins
kotlin.mpp.freeCompilerArgs=-language-version 1.9
